name: validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python3 -m pip install --index-url https://mirrors.aliyun.com/pypi/simple/ -r requirements.txt
      - run: python3 -m py_compile scripts/*.py tests/*.py
      - run: python3 -m json.tool evals/evals.json >/dev/null
      - run: python3 -m unittest discover -s tests -v
      - run: git diff --check
